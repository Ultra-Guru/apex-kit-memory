name: CI

# apex-kit-memory CI —— 两道防线（同构 apex-kit-courier / apex-kit-loom）：
#   1. build-test：库自身编译 + 单测 + publishToMavenLocal 可发布性
#   2. consumer-check：跨仓库验证宿主 Android-Guru-Agent 仍能编译（防下游崩）
#      —— 宿主记忆线已合入 main：push（main）常态触发 + workflow_dispatch
#      手动补检（输入 host-ref 可指定宿主分支）；PR 不跑（build-test 已够，
#      宿主全量编译代价留给 main 变更）。
#
# 宿主消费方式（composite build）：宿主 settings.gradle.kts 的条件
# includeBuild —— 兄弟目录 ../apex-kit-memory 或嵌套子目录 apex-kit-memory
# 存在时接入，并按坐标 com.apex.memkit:memory-core 自动替换。本
# workflow 把两个仓库 checkout 成兄弟 + 嵌套布局，正好命中该条件。
# 命名联动：仓库名统一 apex-(类型)-(名字)（同 apex-kit-courier 等五 kit）。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      host-ref:
        description: '宿主 Android-Guru-Agent 的检查分支（consumer-check 用）'
        required: false
        default: 'main'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build & Test (memory-core + memory-graph-ui)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # memory-graph-ui 为 Android Compose 库 —— 需 SDK（runner 预装，指向即可）
      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build modules (compile only first for fast feedback)
        run: ./gradlew :memory-core:assemble :memory-graph-ui:assembleDebug --no-daemon --stacktrace

      # 纯 JVM 测试必须独立跑（memory-core 零 Android 依赖的可执行证明）
      - name: memory-core pure-JVM tests
        run: ./gradlew :memory-core:test --no-daemon

      # 图谱构建器 / 布局引擎 / 状态机 / 源适配器均为纯 Kotlin —— 单测零
      # Android API（returnDefaultValues 让类加载安全通过，无需 Robolectric）
      - name: memory-graph-ui unit tests
        run: ./gradlew :memory-graph-ui:testDebugUnitTest --no-daemon

      # 可发布性验证：坐标/POM 生成必须完整（双构件）
      - name: publishToMavenLocal smoke check
        run: |
          ./gradlew publishToMavenLocal --no-daemon
          VER=$(grep -m1 '^version = "' memory-core/build.gradle.kts | sed 's/version = "//;s/"//')
          for a in memory-core memory-graph-ui; do
            echo "smoke-checking com.apex.memkit:$a:$VER"
            if ls ~/.m2/repository/com/apex/memkit/$a/$VER/$a-$VER.{module,pom} >/dev/null 2>&1; then
              echo "✅ com.apex.memkit:$a:$VER published to mavenLocal"
            else
              echo "❌ com.apex.memkit:$a:$VER missing in mavenLocal"; exit 1
            fi
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            memory-core/build/reports/tests/
            memory-graph-ui/build/reports/tests/
          retention-days: 7

  consumer-check:
    name: Consumer Check (host Android-Guru-Agent)
    # 宿主记忆线已合入（main 已含 :platform:memory-host 接线）—— 按 ci.yml
    # 顶部注释的迁移约定转常态：push 到 main 自动跨仓验证；手动触发保留
    # （host-ref 可指向宿主任意分支复查）；PR 不触发（build-test 足够）。
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout this repo (sibling layout)
        uses: actions/checkout@v7
        with:
          path: apex-kit-memory

      - name: Checkout host repo (sibling layout)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/Android-Guru-Agent
          ref: ${{ github.event.inputs.host-ref || 'main' }}
          path: Android-Guru-Agent

      # ── 宿主兄弟库钉版补齐（browser / standard / workspace / loom / courier 五 kit）──
      # 宿主 :app 的 composite build 全量接线 —— 按 host 锁定版本检出，
      # 缺嵌套检出则 :app:compileDebugKotlin 直接解析失败（同宿主 CI 口径）。
      # 嵌套路径 apex-kit-*（宿主 settings 探针新名，与 linkage 更名联动）。
      - name: Read host browser-kit pin
        id: bkitpin
        run: |
          set -euo pipefail
          cd Android-Guru-Agent
          PIN=$(head -n 1 gradle/browser-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout apex-kit-browser (host composite build, pinned)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/apex-kit-browser
          ref: ${{ steps.bkitpin.outputs.sha }}
          path: Android-Guru-Agent/apex-kit-browser

      - name: Read host standard-kit pin
        id: akitpin
        run: |
          set -euo pipefail
          cd Android-Guru-Agent
          PIN=$(head -n 1 gradle/standard-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout apex-kit-standard (host composite build, pinned)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/apex-kit-standard
          ref: ${{ steps.akitpin.outputs.sha }}
          path: Android-Guru-Agent/apex-kit-standard

      - name: Read host loom-kit pin
        id: lkitpin
        run: |
          set -euo pipefail
          cd Android-Guru-Agent
          PIN=$(head -n 1 gradle/loom-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout apex-kit-loom (host composite build, pinned)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/apex-kit-loom
          ref: ${{ steps.lkitpin.outputs.sha }}
          path: Android-Guru-Agent/apex-kit-loom

      - name: Read host courier-kit pin
        id: ckitpin
        run: |
          set -euo pipefail
          cd Android-Guru-Agent
          PIN=$(head -n 1 gradle/courier-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout apex-kit-courier (host composite build, pinned)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/apex-kit-courier
          ref: ${{ steps.ckitpin.outputs.sha }}
          path: Android-Guru-Agent/apex-kit-courier

      - name: Read host workspace-kit pin
        id: wkitpin
        run: |
          set -euo pipefail
          cd Android-Guru-Agent
          PIN=$(head -n 1 gradle/workspace-kit.lock 2>/dev/null || true)
          echo "sha=${PIN:-main}" >> "$GITHUB_OUTPUT"

      - name: Checkout apex-kit-workspace (host composite build, pinned)
        uses: actions/checkout@v7
        with:
          repository: Ultra-Guru/apex-kit-workspace
          ref: ${{ steps.wkitpin.outputs.sha }}
          path: Android-Guru-Agent/apex-kit-workspace

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure pre-installed Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > Android-Guru-Agent/local.properties

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 宿主 settings.gradle.kts 的嵌套兜底分支（apex-kit-memory 子目录）命中——
      # composite build 把 com.apex.memkit:memory-core 替换为本仓库检出。
      - name: Link kit into host nested fallback path
        run: |
          ln -s "$GITHUB_WORKSPACE/apex-kit-memory" "$GITHUB_WORKSPACE/Android-Guru-Agent/apex-kit-memory"
          ls -la "$GITHUB_WORKSPACE/Android-Guru-Agent/apex-kit-memory"
          if grep -q "apex-kit-memory" Android-Guru-Agent/settings.gradle.kts; then
            echo "✅ 宿主 settings.gradle.kts 已含 apex-kit-memory 接线"
          else
            echo "ℹ️ 宿主尚未接线 apex-kit-memory（记忆线 PR 合并前正常）——嵌套检出不生效但不阻断"
          fi

      - name: Compile host app module (Kotlin only, no APK packaging)
        working-directory: Android-Guru-Agent
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace -x lint

      - name: Host memory host module tests (kit consumer surface)
        working-directory: Android-Guru-Agent
        run: ./gradlew :platform:memory-host:testDebugUnitTest --no-daemon
